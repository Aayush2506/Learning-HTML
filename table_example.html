
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>Table rowspan example</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Language</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="5">Web Design</td>
                <td>html</td>
            </tr>
            <tr>
                <td>css</td>
            </tr>
              <tr>
                <td>js</td>
            </tr>
                 <tr>
                <td>react</td>
            </tr>
                 <tr>
                <td>bootstrap</td>
            </tr>

            <tr>
                <td rowspan="4">Graphic Design</td>
                <td>figma</td>
            </tr>
            <tr>
                <td>canva</td>
            </tr>
              <tr>
                <td>adobe</td>
            </tr>
              <tr>
                <td>canvas</td>
            </tr>
    
        </tbody>

    </table>
    
    <hr>

    <table border="1">
        <thead>
            <tr>
                <th colspan="5">web design</th>
                <th colspan="4">graphic design</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>html</td>
                <td>css</td>
                <td>js</td>
                <td>react</td>
                <td>bootstrap</td>
           
                <td>adobe</td>
                <td>canva</td>
                <td>figma</td>
                <td>express</td>
        
            </tr>
            
        </tbody>

    </table>

</body>
</html>
