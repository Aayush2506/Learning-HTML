<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <marquee>
        <h1>Hello Welcome to FCTP</h1> 
    </marquee>

       <marquee direction="right" behavior="alternate" bgcolor="yellow">
        <h1>Hello Welcome to FCTP</h1> 
    </marquee>


       <marquee direction="up"  bgcolor="lavender" height="100px">
        <h1>Hello Welcome to FCTP</h1> 
    </marquee>


       <marquee direction="right" scrolldelay="400" behavior="alternate" bgcolor="yellow">

           <marquee direction="right"  scrollamount="40" behavior="alternate" bgcolor="lavender">
        <h1>Hello Welcome to FCTP</h1> 
    </marquee>
