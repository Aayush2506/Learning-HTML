<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Input Type Example</h2>

    <form>
        <label>Enter Name</label>
        <input type="text" placeholder="Enter name"/>

         <label>Enter Email</label>
        <input type="email" placeholder="Enter email">

        <br><br>
         <label>Enter Aadhar No</label>
        <input type="number" placeholder="Enter Aadhar no">    
        
         <label>Enter Password</label>
        <input type="password" placeholder="Enter password">
        <br><br>

         <label>Enter DOB</label>
        <input type="date" >

        <label>Enter week</label>
        <input type="week" >

        <label>Enter Date and Time</label>
        <input type="datetime-local" >

        <label>Enter Month</label>
        <input type="month" >
        <br><br>

        <label>Choose Cities</label>
        <input type="checkbox" checked >Mumbai
        <input type="checkbox" checked >Delhi
        <input type="checkbox" >Pune
        <input type="checkbox" >Hyderabad
        <br><br>

        <label>Select gender</label>   
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Other

        <!-- give a group name to select only one -->

        <br><br>

        <label>Select Color</label>
        <input type="color">

         <label>Select Range</label>
        <input type="range">

        <br><br>

        <label>Upload Docs</label>
        <input type="file">

        <label>Upload Docs</label>
        <input type="file" multiple>

        <br><br>

        <label>Search</label>
        <input type="search" >

        <label>Enter URL</label>
        <input type="url" placeholder="https://eg.com">

        <br><br>

        <label>telephone no</label>
        <input type="tel" placeholder="9856748522">

        <label>Select City</label>
        <select>
            <option>Choose your City.....</option>
            <option>Mumbai</option>
            <option>Pune</option>
            <option>Nashik</option>
           <option>Jalgaon</option>
        </select>

        <br><br>

        <label>Enter Address</label>
        <textarea rows="7" cols="15"></textarea>

        <br><br>

        <input type="submit" value="Submit Form">
        <input type="button" value="Submit Form">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
